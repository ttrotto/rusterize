[workspace]
members = ["rust", "python", "R/rusterize/src/rust"]
# bare `cargo test`/`cargo build` at the root only touch the core: the Python crate pulls pyo3 into polars
# (via pyo3-polars), which cannot link into a standalone test binary. Use `-p <crate>` for the others.
default-members = ["rust"]
resolver = "3"

[workspace.package]
description = "Extremely fast geometry rasterization"
edition = "2024"
authors = ["Tommaso Trotto <armityle@outlook.it>"]
license = "MIT"
repository = "https://github.com/ttrotto/rusterize"
categories = ["science::geo"]
keywords = ["fast", "raster", "geometry"]

[workspace.dependencies]
geo = "0.33.1"
geo-types = "0.7.20"
num-traits = "0.2.19"
rayon = "1.12.0"

[profile.dist-release]
inherits = "release"
codegen-units = 1
debug = false
lto = "fat"
