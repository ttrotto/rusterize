[package]
name = "rusterize-rs"
description = { workspace = true }
version = "0.2.0"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
readme = "README.md"
autoexamples = false

[lib]
name = "rusterize"

[dependencies]
thiserror = "2.0.21"
geo = { workspace = true }
geo-types = { workspace = true }
ndarray = { version = "0.17.2", features = ["rayon"] }
num-traits = { workspace = true }
rayon = { workspace = true }

polars = { version = "0.55.2", default-features = false, features = ["lazy", "simd", "performant", "nightly", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"], optional = true }

[features]
polars = ["dep:polars"]

[package.metadata.docs.rs]
features = ["polars"]
